# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

[line_break]
disabled = false

[cmd_duration]
disabled = true

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
force_display = true

[kubernetes]
disabled = false

[gcloud]
disabled = true

[custom.databricks]
command = 'starship-databricks'
when = 'command -v starship-databricks >/dev/null 2>&1'
shell = ['sh']
symbol = '󰽙 '
style = 'bold red'
format = '([$symbol$output]($style) )'
